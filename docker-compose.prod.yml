# Production. One public port. The browser talks to the site; nginx proxies the worker.
#
# Before the first start:
#   npm run roads:fetch
#   npm run district:export
#   npm run attractors:export
#
#   docker compose -f docker-compose.prod.yml build
#   docker push tuguldurdev/ub-traffic:sim
#   docker push tuguldurdev/ub-traffic:web
#
# On the server:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The site is http://<host>:8090/. Saved results and the SUMO network stay in ./data/sim.
# The city road file is read from ./apps/web/public/data at runtime.

services:
  sim:
    image: tuguldurdev/ub-traffic:sim
    build:
      context: ./services/sim
    restart: unless-stopped
    volumes:
      - ./data/sim:/data
    environment:
      SIM_DATA: /data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: tuguldurdev/ub-traffic:web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SIMULATION_URL: /api
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./apps/web/public/data:/usr/share/nginx/html/data:ro
    depends_on:
      sim:
        condition: service_healthy
